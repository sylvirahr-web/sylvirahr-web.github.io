<!DOCTYPE html>
<html>
<head>
  <title>Random Joke Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 2.5em;
    }

    .joke-box {
      background: #f8f9fa;
      border-left: 5px solid #667eea;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 30px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .joke-text {
      font-size: 1.2em;
      color: #333;
      line-height: 1.6;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.1em;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .loading {
      color: #667eea;
      font-style: italic;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
    }

    .joke-category {
      color: #999;
      font-size: 0.9em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😂 Joke Generator</h1>
    
    <div class="joke-box">
      <div id="jokeContent" class="joke-text">
        Click the button to get a random joke!
      </div>
    </div>

    <button onclick="getJoke()">Get a Joke</button>
    <div id="category" class="joke-category"></div>
  </div>

  <script>
    async function getJoke() {
      const jokeContent = document.getElementById('jokeContent');
      const categoryDiv = document.getElementById('category');
      
      jokeContent.innerHTML = '<span class="loading">Loading joke...</span>';
      categoryDiv.innerHTML = '';

      try {
        // Using JokeAPI (free, no authentication needed)
        const response = await fetch('https://v2.jokeapi.dev/joke/Any?format=json');
        
        if (!response.ok) {
          throw new Error('Failed to fetch joke');
        }

        const data = await response.json();

        // Handle different joke types
        if (data.type === 'single') {
          jokeContent.textContent = data.joke;
        } else if (data.type === 'twopart') {
          jokeContent.textContent = data.setup + '\n\n' + data.delivery;
        }

        // Display category
        categoryDiv.textContent = `Category: ${data.category}`;

      } catch (error) {
        jokeContent.innerHTML = '<span class="error">Oops! Could not load a joke. Try again!</span>';
        console.error('Error:', error);
      }
    }

    // Load a joke when page loads
    getJoke();
  </script>
</body>
</html>
